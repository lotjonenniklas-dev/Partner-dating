<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Overlapping circles logo -->
    <defs>
        <clipPath id="partner-ring">
            <circle cx="29.2" cy="40" r="14.8" />
        </clipPath>
    </defs>
    <circle cx="50.8" cy="40" r="14.8" fill="#000000" opacity="0.22" clip-path="url(#partner-ring)" />
    <circle cx="29.2" cy="40" r="17.2" fill="none" stroke="#000000" stroke-width="4.7" />
    <circle cx="50.8" cy="40" r="17.2" fill="none" stroke="#000000" stroke-width="4.7" />
    
    <!-- Text "Partner" -->
    <text x="90" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="600" fill="#1a1a1a" letter-spacing="-1">Partner</text>
</svg>
